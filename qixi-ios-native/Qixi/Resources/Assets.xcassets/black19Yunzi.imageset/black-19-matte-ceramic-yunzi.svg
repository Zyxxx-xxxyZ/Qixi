<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Black stone - matte ceramic yunzi</title>
  <desc id="desc">A no-glare black ceramic Go stone with a very quiet green Yunzi-like undertone.</desc>
  <metadata>Original matte black ceramic Go stone generated for Qixi. No third-party source artwork.</metadata>
  <defs>
    <radialGradient id="body" cx="44%" cy="35%" r="65%">
      <stop offset="0" stop-color="#2f3934"/>
      <stop offset=".45" stop-color="#13201b"/>
      <stop offset=".82" stop-color="#040807"/>
      <stop offset="1" stop-color="#000100"/>
    </radialGradient>
    <radialGradient id="edge" cx="50%" cy="48%" r="54%">
      <stop offset=".72" stop-color="#00130d" stop-opacity="0"/>
      <stop offset="1" stop-color="#00130d" stop-opacity=".44"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-20%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity=".25"/>
    </filter>
  </defs>
  <g filter="url(#softShadow)">
    <circle cx="128" cy="128" r="103" fill="url(#body)"/>
    <circle cx="128" cy="128" r="103" fill="url(#edge)"/>
    <circle cx="128" cy="128" r="102" fill="none" stroke="#6fa48a" stroke-opacity=".20" stroke-width="2"/>
    
  </g>
</svg>
